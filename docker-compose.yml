version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: yatraverse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yatraverse
      POSTGRES_PASSWORD: yatraverse
      POSTGRES_DB: yatraverse
    ports:
      - "5432:5432"
    volumes:
      - yatraverse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yatraverse -d yatraverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yatraverse_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@yatraverse.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  yatraverse_pgdata: